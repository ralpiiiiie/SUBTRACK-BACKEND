services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: api-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r '$$socket = @fsockopen(\"127.0.0.1\", 9000); exit($$socket ? 0 : 1);'",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      # Bind-mount the project source so changes reload live, but EXCLUDE
      # vendor/ — it is baked into the image (see Dockerfile development
      # stage) so it lives on the fast container layer. On hosts where the
      # bind mount is slow (common on Windows), leaving vendor on the mount
      # made every request take ~10s and intermittently trip the client
      # timeout, surfacing as "Cannot reach the server".
      - ./app:/var/www/html/app
      - ./bootstrap:/var/www/html/bootstrap
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./docker:/var/www/html/docker
      - ./public:/var/www/html/public
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./storage:/var/www/html/storage
      - ./tests:/var/www/html/tests
      - ./composer.json:/var/www/html/composer.json
      - ./composer.lock:/var/www/html/composer.lock
      - ./.env:/var/www/html/.env
      - ./artisan:/var/www/html/artisan
      - ./phpunit.xml:/var/www/html/phpunit.xml
      - ./package.json:/var/www/html/package.json
      - ./vite.config.js:/var/www/html/vite.config.js
    networks:
      - laravel-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: api-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "3001:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - laravel-network

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DATABASE: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - laravel-network
    
  phpmyadmin-new:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:3002:80"
    networks:
      - laravel-network


networks:
  laravel-network:
    driver: bridge

volumes:
  postgres-data:
