# Production overrides for the VPS.
#
#   docker compose --env-file .env.production \
#     -f docker-compose.yaml -f docker-compose.prod.yaml up -d --build
#
# Code + vendor are baked into the images (no bind mounts). MySQL is NOT
# exposed to the host — only the app reaches it over the internal network.
services:
  app:
    build:
      target: production
    image: laravel-api-app:prod
    env_file:
      - .env.production

  web:
    build:
      target: nginx
    image: laravel-api-web:prod
    ports:
      # Bound to localhost only — Caddy (on the host) owns public 80/443
      # and reverse-proxies here for TLS. See DEPLOY.md.
      - "127.0.0.1:8000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/up >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
