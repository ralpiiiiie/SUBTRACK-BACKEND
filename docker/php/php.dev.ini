memory_limit=512M
upload_max_filesize=20M
post_max_size=20M
max_execution_time=0

display_errors=On
log_errors=On
error_reporting=E_ALL

; Reload code on every request so edits take effect immediately.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=1
opcache.revalidate_freq=0

expose_php=On
